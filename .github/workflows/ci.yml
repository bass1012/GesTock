name: CI — Lint & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend (lint + tests + coverage)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gestock_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: gestock_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://gestock_test:test_password@localhost:5432/gestock_test?schema=public
      JWT_SECRET: ci-test-jwt-secret-not-used-in-prod
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-used-in-prod
      ENCRYPTION_KEY: ci-test-encryption-key-not-used-in-prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace root)
        run: npm ci
        # Install from root to use the single monorepo lock file

      - name: Format check
        run: npm run format:check

      - name: TypeScript type check
        run: npx tsc --noEmit
        working-directory: backend

      - name: Lint
        run: npm run lint
        working-directory: backend

      - name: Security audit (npm audit)
        run: npm audit --audit-level=high
        working-directory: backend
        # Fails on high/critical vulnerabilities only
        continue-on-error: false

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: backend

      - name: Run tests with coverage
        run: npx jest --coverage --forceExit
        working-directory: backend
        # coverageThreshold in jest.config.js — CI fails if thresholds not met

      - name: Upload coverage report (artifact)
        uses: actions/upload-artifact@v4.6.0
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: success()
        with:
          directory: backend/coverage/
          flags: backend
          fail_ci_if_error: false
          # Token optionnel pour les repos publics — requis pour les repos privés
          # token: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    name: Frontend (lint + tests + coverage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace root)
        run: npm ci
        # Install from root to use the single monorepo lock file

      - name: Format check
        run: npm run format:check

      - name: TypeScript type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Security audit (npm audit)
        run: npm audit --audit-level=high
        working-directory: frontend
        continue-on-error: false

      - name: Run tests with coverage
        run: npx vitest run --coverage
        working-directory: frontend

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: success()
        with:
          directory: frontend/coverage/
          flags: frontend
          fail_ci_if_error: false
          # token: ${{ secrets.CODECOV_TOKEN }}

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    # Valider que les images se construisent — ne push pas en registry
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (cache only)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: gestock-backend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (cache only)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: gestock-frontend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
