name: CD — Deploy to Production

on:
  push:
    branches: [main]
    paths-ignore:
      - 'tasks/**'
      - '**.md'
      - '.github/dependabot.yml'
  workflow_dispatch: # Permet le déclenchement manuel depuis GitHub UI

# Eviter les déploiements parallèles
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Verify Secrets Presence
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ]; then echo "❌ SSH_HOST est VIDE"; else echo "✅ SSH_HOST est présent"; fi
          if [ -z "${{ secrets.SSH_USER }}" ]; then echo "❌ SSH_USER est VIDE"; else echo "✅ SSH_USER est présent"; fi
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then echo "❌ SSH_PRIVATE_KEY est VIDE"; else echo "✅ SSH_PRIVATE_KEY est présent"; fi
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then exit 1; fi

      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Deploy via SSH (with rollback on failure)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /home/ubuntu/GesTock

            # ── Snapshot de l'état actuel pour rollback ───────────────────────
            PREVIOUS_COMMIT=$(git rev-parse HEAD)
            echo "=== Commit actuel (rollback cible) : $PREVIOUS_COMMIT ==="

            # Sauvegarder les IDs des images en cours (pour rollback docker)
            BACKEND_IMAGE_BEFORE=$(docker compose -f docker-compose.prod.yml images -q backend 2>/dev/null || echo "none")
            FRONTEND_IMAGE_BEFORE=$(docker compose -f docker-compose.prod.yml images -q frontend 2>/dev/null || echo "none")

            # ── Déploiement ───────────────────────────────────────────────────
            deploy() {
              echo "=== Pull latest changes ==="
              git fetch origin main
              git reset --hard origin/main

              echo "=== Build & restart containers ==="
              docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

              echo "=== Apply DB migrations ==="
              docker compose -f docker-compose.prod.yml exec -T backend npx prisma migrate deploy --skip-generate

              echo "=== Cleanup old images ==="
              docker image prune -f

              echo "=== SSL renewal (if due) ==="
              sudo certbot renew --non-interactive --quiet || echo "Certbot non installé ou pas dû"

              echo "=== Reload nginx ==="
              sudo nginx -t && sudo systemctl reload nginx || echo "nginx reload skipped (SSL not configured yet)"

              echo "=== Health check ==="
              sleep 10
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://gestock.allsite.cloud/api/health)
              if [ "$STATUS" != "200" ]; then
                echo "❌ HEALTH CHECK FAILED: HTTP $STATUS"
                return 1
              fi
              echo "✅ Health check passed (HTTP $STATUS)"
            }

            # ── Rollback ──────────────────────────────────────────────────────
            rollback() {
              echo ""
              echo "🔄 ===== ROLLBACK EN COURS ====="
              echo "🔄 Retour au commit : $PREVIOUS_COMMIT"

              git reset --hard "$PREVIOUS_COMMIT"

              echo "🔄 Rebuild de l'ancienne version..."
              docker compose -f docker-compose.prod.yml up -d --build --remove-orphans || true

              echo "🔄 Health check post-rollback..."
              sleep 10
              ROLLBACK_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://gestock.allsite.cloud/api/health)
              if [ "$ROLLBACK_STATUS" = "200" ]; then
                echo "✅ Rollback réussi (HTTP $ROLLBACK_STATUS)"
              else
                echo "❌ Rollback échoué aussi (HTTP $ROLLBACK_STATUS) — intervention manuelle requise"
              fi

              echo "🔄 ============================="
              exit 1   # Signaler l'échec au CI même après rollback
            }

            # ── Exécution avec trap rollback ──────────────────────────────────
            if ! deploy; then
              rollback
            fi
