# GesTock - Nginx SSL Configuration
# Généré le 2026-05-11 — configurer le domain dans server_name avant certbot

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name gestock.allsite.cloud;

    # Let's Encrypt ACME challenge (obligatoire pour certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Health check (pas de redirect)
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Tout le reste → redirect vers HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gestock.allsite.cloud;

    # SSL — configuré automatiquement par certbot
    ssl_certificate /etc/letsencrypt/live/gestock.allsite.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gestock.allsite.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), fullscreen=(self)" always;

    # Rate limiting
    limit_req zone=api_limit burst=50 nodelay;

    # Taille max du body (pour imports CSV/images)
    client_max_body_size 10M;

    # Health check
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Backend API
    location /api {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Frontend static files
    location / {
        proxy_pass http://frontend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
